name: Build

# Manual trigger only: installers to test without creating a release.
# For releases, use the Release workflow (tag → publish.yml builds + uploads).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
          - os: macos-latest
            artifact_name: mac
          - os: windows-latest
            artifact_name: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build app (no publish)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ui
          tauriScript: pnpm tauri

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          codesign --verify --deep --strict --verbose=2 "$MNT/Anamnesis.app"
          hdiutil detach "$MNT"

      - name: Build headless core
        shell: bash
        run: |
          cargo build --release -p anamnesis-core
          mkdir -p headless
          cp target/release/anamnesis-core* headless/ 2>/dev/null || true
          rm -f headless/*.d headless/*.pdb

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: anamnesis-${{ matrix.artifact_name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            headless/*
          retention-days: 14
          if-no-files-found: error
